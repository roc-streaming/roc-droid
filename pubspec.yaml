name: roc_droid
description: "Roc for Android!"
publish_to: 'none'
version: 0.3.0
environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0'
  logger: ^2.4.0
  mobx: ^2.3.3+2
  flutter_mobx: ^2.2.1+1
  darq: ^2.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3
  pigeon: ^22.3.0
  event: ^3.1.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.2.1
  shared_preferences: ^2.2.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.2
  build_runner: ^2.4.11
  mobx_codegen: ^2.6.1
  flutter_oss_licenses: ^3.0.2
  json_serializable: ^6.9.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/splash.png
    - assets/splash_big.png
    - assets/icon.png

flutter_native_splash:
  android: true
  ios: true
  web: false
  image: assets/splash.png
  android_12:
    image: assets/splash_big.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon.png"
